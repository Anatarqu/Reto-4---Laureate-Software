# Balanceador (vista de latencia): terminación TLS, límite de tasa por token y reparto
# entre réplicas. La imagen oficial corre sin privilegios, por eso usa puertos > 1024.
global
    log stdout format raw local0 info
    maxconn 8000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout http-keep-alive 10s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    accepted_payload_size 8192

# Entrada pública: la PWA (k6) y la suite de ataques entran por aquí.
frontend fe_publico
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/tls.pem
    # Límite de tasa POR TOKEN (k6 sale de una sola IP; limitar por IP bloquearía la prueba).
    # Uso normal: 1 guardado cada ~10 s por estudiante. Umbral: más de 20 en 10 s.
    stick-table type string len 64 size 200k expire 30s store http_req_rate(10s)
    http-request track-sc0 req.hdr(Authorization),sha2(256),hex if { req.hdr(Authorization) -m found }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 20 }
    default_backend be_gateway

backend be_gateway
    balance roundrobin
    option httpchk GET /salud
    http-check expect status 200
    server gw1 gateway:8000 check inter 2s fall 3 rise 2 resolvers docker init-addr last,libc,none

# Entrada interna: el gateway reenvía a Respuestas por aquí (reparte entre réplicas).
frontend fe_interno
    bind :8090
    default_backend be_respuestas

backend be_respuestas
    balance roundrobin
    option httpchk GET /salud
    http-check expect status 200
    server-template resp 4 respuestas:8081 check inter 2s fall 3 rise 2 resolvers docker init-addr none

# Métricas de HAProxy para Prometheus.
frontend fe_metricas
    bind :8405
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 200 content-type text/plain string "ok" if { path /salud }
